<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SANKHYA BotBuilder</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; max-width: 820px; margin: 40px auto; padding: 0 16px; }
    .card { border: 1px solid #eee; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { font-weight: 700; display:block; margin: 10px 0 6px; }
    select, input { width: 100%; padding: 10px; }
    button { padding: 10px 14px; font-weight: 800; }
    code { display:block; background:#f7f7f7; padding: 10px; border-radius: 10px; overflow-x:auto; }
    .muted { color:#666; }
  </style>
</head>
<body>
  <h1>SANKHYA BotBuilder (Demo)</h1>
  <p class="muted">Pick a bot type. We'll generate a setup code + installer command. This demo avoids asking you for prompts.</p>

  <div class="card">
    <label>Bot type</label>
    <select id="botType">
      <option value="personal">Personal assistant</option>
      <option value="sales">Sales follow-up bot</option>
      <option value="support">Customer support bot</option>
      <option value="hiring">Hiring coordinator bot</option>
    </select>

    <label>Channel</label>
    <select id="channel">
      <option value="whatsapp">WhatsApp</option>
      <option value="telegram">Telegram (later)</option>
    </select>

    <label>
      <input type="checkbox" id="voice" /> Enable voice notes (transcription)
    </label>

    <button id="create">Create setup</button>
  </div>

  <div class="card" id="out" style="display:none;">
    <div><b>Setup code:</b> <span id="code"></span></div>
    <div class="muted" style="margin-top:10px;">Run this on the laptop where you want the bot:</div>
    <code id="cmd"></code>
  </div>

  <script>
    const out = document.getElementById('out');
    const codeEl = document.getElementById('code');
    const cmdEl = document.getElementById('cmd');

    document.getElementById('create').addEventListener('click', async () => {
      const body = {
        botType: document.getElementById('botType').value,
        channel: document.getElementById('channel').value,
        voice: document.getElementById('voice').checked,
      };

      const r = await fetch('/api/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const j = await r.json();
      codeEl.textContent = j.code;
      cmdEl.textContent = j.installLinuxMac;
      out.style.display = 'block';
    });
  </script>
</body>
</html>
